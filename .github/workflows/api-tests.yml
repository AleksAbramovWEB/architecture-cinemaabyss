name: API Tests

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      test_folder:
        description: 'Postman folder (empty runs the complete collection)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  api-tests:
    name: Docker Compose API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Postman runner
        working-directory: tests/postman
        run: npm ci

      - name: Build and start the complete stack
        run: docker compose up -d --build

      - name: Wait for HTTP readiness
        run: bash scripts/ci/wait-for-services.sh

      - name: Run Postman collection
        working-directory: tests/postman
        env:
          TEST_FOLDER: ${{ inputs.test_folder || '' }}
        shell: bash
        run: |
          if [[ -n "$TEST_FOLDER" ]]; then
            npm run test:local -- --folder "$TEST_FOLDER"
          else
            npm run test:local
          fi

      - name: Collect Compose diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts/api
          docker compose ps --all > artifacts/api/compose-status.txt
          docker compose logs --no-color > artifacts/api/compose.log

      - name: Upload API reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-tests
          path: |
            tests/postman/reports/
            artifacts/api/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop the CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
