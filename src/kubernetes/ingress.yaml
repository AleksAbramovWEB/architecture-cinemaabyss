apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Create this Secret at deployment time; do not commit private keys.
  tls:
    - hosts:
        - cinemaabyss.example.com
      secretName: cinemaabyss-tls
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # All business API paths, including /api/events, pass through the same Gateway.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
