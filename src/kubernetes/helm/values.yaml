# One release per namespace. Kubernetes namespace comes from --namespace.
global:
  domain: cinemaabyss.example.com

# Public GHCR images need no registry secret. For private images choose one option.
imagePullSecrets:
  existingSecret: ""
  dockerconfigjson: ""

database:
  host: postgres
  port: 5432
  name: cinemaabyss
  user: postgres
  password: postgres_password
  existingSecret: ""
  image:
    repository: postgres
    tag: "14"
    pullPolicy: IfNotPresent
  resources:
    limits: {cpu: 1000m, memory: 1Gi}
    requests: {cpu: 500m, memory: 512Mi}
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""

monolith:
  enabled: true
  image:
    repository: ghcr.io/aleksabramovweb/architecture-cinemaabyss/monolith
    tag: cinema
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  service: {port: 8080, targetPort: 8080, type: ClusterIP}

proxyService:
  enabled: true
  image:
    repository: ghcr.io/aleksabramovweb/architecture-cinemaabyss/proxy-service
    tag: cinema
    pullPolicy: IfNotPresent
  replicas: 2
  javaOpts: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError"
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 128Mi}
  service: {port: 80, targetPort: 8000, type: ClusterIP}

moviesService:
  enabled: true
  image:
    repository: ghcr.io/aleksabramovweb/architecture-cinemaabyss/movies-service
    tag: cinema
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits: {cpu: 300m, memory: 256Mi}
    requests: {cpu: 100m, memory: 128Mi}
  service: {port: 8081, targetPort: 8081, type: ClusterIP}

eventsService:
  enabled: true
  image:
    repository: ghcr.io/aleksabramovweb/architecture-cinemaabyss/events-service
    tag: cinema
    pullPolicy: IfNotPresent
  replicas: 1
  javaOpts: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError"
  resources:
    limits: {cpu: 500m, memory: 768Mi}
    requests: {cpu: 100m, memory: 256Mi}
  service: {port: 8082, targetPort: 8082, type: ClusterIP}

kafka:
  enabled: true
  image:
    repository: wurstmeister/kafka
    tag: 2.13-2.7.0
    pullPolicy: IfNotPresent
  replicas: 1
  heapOpts: "-Xms256m -Xmx512m"
  resources:
    limits: {cpu: 1000m, memory: 1Gi}
    requests: {cpu: 200m, memory: 512Mi}
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""

zookeeper:
  enabled: true
  image:
    repository: wurstmeister/zookeeper
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  heapOpts: "-Xms64m -Xmx256m"
  resources:
    limits: {cpu: 500m, memory: 512Mi}
    requests: {cpu: 100m, memory: 256Mi}
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: cinemaabyss-tls

config:
  gradualMigration: true
  moviesMigrationPercent: 100
  # Empty derives kafka:9092 for the bundled broker.
  kafkaBrokers: ""
  kafkaGroupId: cinemaabyss-events-service
