{{- if and (not .Values.imagePullSecrets.existingSecret) .Values.imagePullSecrets.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecrets.dockerconfigjson | quote }}
{{- end }}
