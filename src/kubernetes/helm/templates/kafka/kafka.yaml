{{- if .Values.zookeeper.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
    app: zookeeper
    app.kubernetes.io/component: zookeeper
spec:
  ports:
    - port: 2181
      targetPort: client
      name: client
    - port: 2888
      targetPort: server
      name: server
    - port: 3888
      targetPort: leader-election
      name: leader-election
  selector:
    app: zookeeper
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.zookeeper.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
    app: zookeeper
    app.kubernetes.io/component: zookeeper
spec:
  accessModes:
    - {{ .Values.zookeeper.persistence.accessMode | quote }}
  {{- with .Values.zookeeper.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.zookeeper.persistence.size | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
    app: zookeeper
    app.kubernetes.io/component: zookeeper
spec:
  serviceName: zookeeper
  replicas: {{ .Values.zookeeper.replicas }}
  selector:
    matchLabels:
      app: zookeeper
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cinemaabyss.labels" . | nindent 8 }}
        app: zookeeper
        app.kubernetes.io/component: zookeeper
    spec:
      {{- include "cinemaabyss.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: zookeeper
          image: {{ printf "%s:%s" .Values.zookeeper.image.repository (.Values.zookeeper.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.zookeeper.image.pullPolicy }}
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: server
            - containerPort: 3888
              name: leader-election
          resources:
            {{- toYaml .Values.zookeeper.resources | nindent 12 }}
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: JVMFLAGS
              value: {{ .Values.zookeeper.heapOpts | default "-Xms64m -Xmx256m" | quote }}
          volumeMounts:
            - name: zookeeper-data
              # The image's actual data directory must share the same lifecycle as Kafka data.
              mountPath: /opt/zookeeper-3.4.13/data
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 15
            timeoutSeconds: 2
      volumes:
        - name: zookeeper-data
          {{- if .Values.zookeeper.persistence.enabled }}
          persistentVolumeClaim:
            claimName: zookeeper-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
{{- if .Values.kafka.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
    app: kafka
    app.kubernetes.io/component: kafka
spec:
  # The advertised address must also be reachable while the broker is starting.
  publishNotReadyAddresses: true
  ports:
    - port: 9092
      targetPort: kafka
      name: kafka
  selector:
    app: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.kafka.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
    app: kafka
    app.kubernetes.io/component: kafka
spec:
  accessModes:
    - {{ .Values.kafka.persistence.accessMode | quote }}
  {{- with .Values.kafka.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.kafka.persistence.size | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
    app: kafka
    app.kubernetes.io/component: kafka
spec:
  serviceName: kafka
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cinemaabyss.labels" . | nindent 8 }}
        app: kafka
        app.kubernetes.io/component: kafka
    spec:
      {{- include "cinemaabyss.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: kafka
          image: {{ printf "%s:%s" .Values.kafka.image.repository (.Values.kafka.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - containerPort: 9092
              name: kafka
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          env:
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            - name: KAFKA_PORT
              value: "9092"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /kafka/kafka-logs
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | default "-Xms256m -Xmx512m" | quote }}
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          # Events KafkaAdmin creates the topics. KAFKA_CREATE_TOPICS would spawn
          # parallel CLI JVMs with the broker's heap and exhaust this memory limit.
          volumeMounts:
            - name: kafka-data
              mountPath: /kafka
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            timeoutSeconds: 2
      volumes:
        - name: kafka-data
          {{- if .Values.kafka.persistence.enabled }}
          persistentVolumeClaim:
            claimName: kafka-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
