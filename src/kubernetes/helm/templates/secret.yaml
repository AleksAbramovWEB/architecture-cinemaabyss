{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: cinemaabyss-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cinemaabyss.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
