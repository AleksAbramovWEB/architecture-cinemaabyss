{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: proxy-service
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: proxy-service
        {{- include "cinemaabyss.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- include "cinemaabyss.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: proxy-service
          image: {{ printf "%s:%v" .Values.proxyService.image.repository .Values.proxyService.image.tag | quote }}
          imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.proxyService.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.proxyService.service.targetPort | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.proxyService.javaOpts | quote }}
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          resources:
            {{- toYaml .Values.proxyService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: proxy-service
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  type: {{ .Values.proxyService.service.type }}
  selector:
    app: proxy-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.proxyService.service.port }}
      targetPort: http
{{- end }}
