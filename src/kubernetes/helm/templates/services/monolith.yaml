{{- if .Values.monolith.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: {{ .Release.Namespace }}
  labels:
    app: monolith
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.monolith.replicas }}
  selector:
    matchLabels:
      app: monolith
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ dict "host" .Values.database.host "port" .Values.database.port "name" .Values.database.name "user" .Values.database.user | toJson | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: monolith
        {{- include "cinemaabyss.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- include "cinemaabyss.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: monolith
          image: {{ printf "%s:%v" .Values.monolith.image.repository .Values.monolith.image.tag | quote }}
          imagePullPolicy: {{ .Values.monolith.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.monolith.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.monolith.service.targetPort | quote }}
            - name: DB_CONNECTION_STRING
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
            - secretRef:
                name: {{ include "cinemaabyss.databaseSecretName" . }}
          resources:
            {{- toYaml .Values.monolith.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/users
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: monolith
  namespace: {{ .Release.Namespace }}
  labels:
    app: monolith
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  type: {{ .Values.monolith.service.type }}
  selector:
    app: monolith
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.monolith.service.port }}
      targetPort: http
{{- end }}
