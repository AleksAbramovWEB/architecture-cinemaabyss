apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: cinemaabyss
  labels:
    app: events-service
spec:
  # The MVP topics have one partition each; one consumer instance is sufficient.
  replicas: 1
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: events-service
          image: ghcr.io/aleksabramovweb/architecture-cinemaabyss/events-service:cinema
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError"
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /api/events/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          # This endpoint checks the HTTP application; Kafka delivery is verified by API tests.
          readinessProbe:
            httpGet:
              path: /api/events/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/events/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: cinemaabyss
spec:
  type: ClusterIP
  selector:
    app: events-service
  ports:
    - name: http
      port: 8082
      targetPort: http
