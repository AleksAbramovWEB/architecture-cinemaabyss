server:
  port: ${PORT:8000}
  shutdown: graceful
spring:
  application:
    name: proxy-service
  mvc:
    formcontent:
      filter:
        enabled: false
  servlet:
    multipart:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
proxy:
  monolith-url: ${MONOLITH_URL:http://localhost:8080}
  movies-service-url: ${MOVIES_SERVICE_URL:http://localhost:8081}
  events-service-url: ${EVENTS_SERVICE_URL:http://localhost:8082}
  gradual-migration: ${GRADUAL_MIGRATION:true}
  movies-migration-percent: ${MOVIES_MIGRATION_PERCENT:50}
  connect-timeout: ${PROXY_CONNECT_TIMEOUT:2s}
  request-timeout: ${PROXY_REQUEST_TIMEOUT:10s}
